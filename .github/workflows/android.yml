name: APK Android

on:
  push:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Los runners de GitHub ya incluyen el SDK de Android (ANDROID_HOME);
      # Gradle descarga solo lo que falte (plataforma 35, build-tools).

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../nano-control.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nano-control-apk
          path: nano-control.apk

      - name: Publicar en Releases (enlace fijo para descargar en el móvil)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Nano Control para Android (última versión)
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: nano-control.apk
          body: |
            Abre esta página en tu Android, toca **nano-control.apk** e instálala
            (permite «instalar apps desconocidas» cuando lo pida).
            Compilada desde ${{ github.sha }}.
